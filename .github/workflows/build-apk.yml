name: Build DKxx Map APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract DKxx Map project
        run: |
          rm -rf app
          rm -f build.gradle settings.gradle settings.gradle.kts gradle.properties
          unzip -o DKxx-Map.zip -d .
          echo "DKxx Map project extracted"
          ls -la
          ls -la app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build DKxx Map
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DKxx-Map-debug
          path: app/build/outputs/apk/debug/*.apk
